<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.json">
<title>HTML Live Editor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0f17;color:#fff;overflow:hidden}
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #252b36;background:#111827}
h1{font-size:16px;margin:0}.actions{display:flex;gap:7px}button{border:0;border-radius:8px;padding:7px 10px;background:#263041;color:#fff;font-weight:600}
main{height:calc(100% - 52px);display:grid;grid-template-columns:1fr 1fr}
.panel{min-width:0;display:flex;flex-direction:column}.panel+ .panel{border-left:1px solid #252b36}
.tabs{display:flex;gap:4px;padding:7px;background:#151b26;border-bottom:1px solid #252b36}
.tab{background:transparent;color:#aeb7c6}.tab.active{background:#2a3445;color:#fff}
textarea{flex:1;width:100%;resize:none;border:0;outline:0;background:#0d121b;color:#e7edf7;padding:14px;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;tab-size:2}
iframe{flex:1;width:100%;border:0;background:#fff}
@media(max-width:700px){main{grid-template-columns:1fr}.panel.preview{display:flex}.panel.editor{height:52%}.panel.preview{height:48%}.panel+.panel{border-left:0;border-top:1px solid #252b36}}
</style>
</head>
<body>
<header><h1>HTML Live Editor</h1><div class="actions"><button id="save">Save</button><button id="reset">Reset</button></div></header>
<main>
<section class="panel editor">
<div class="tabs">
<button class="tab active" data-lang="html">HTML</button>
<button class="tab" data-lang="css">CSS</button>
<button class="tab" data-lang="js">JS</button>
</div>
<textarea id="code" spellcheck="false"></textarea>
</section>
<section class="panel preview"><iframe id="preview" sandbox="allow-scripts allow-forms"></iframe></section>
</main>
<script>
const defaults={
html:`<div class="card">
  <h1>Hello 👋</h1>
  <p>Write HTML, CSS and JS — preview updates automatically.</p>
  <button onclick="hello()">Click me</button>
</div>`,
css:`body{font-family:system-ui;padding:30px;background:#f5f7fb}
.card{max-width:520px;margin:auto;padding:24px;border-radius:18px;background:white;box-shadow:0 8px 30px #0001}
button{padding:10px 14px;border:0;border-radius:10px;background:#111827;color:white}`,
js:`function hello(){alert("Hello from JavaScript!");}`
};
let state=JSON.parse(localStorage.getItem("html-live-editor")||"null")||{...defaults};
let lang="html";
const ta=document.getElementById("code"), frame=document.getElementById("preview");
function render(){
 ta.value=state[lang];
 const doc=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>${state.css}</style></head><body>${state.html}<script>${state.js}<\/script></body></html>`;
 frame.srcdoc=doc;
}
ta.addEventListener("input",()=>{state[lang]=ta.value;render()});
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");lang=b.dataset.lang;render();
});
document.getElementById("save").onclick=()=>{localStorage.setItem("html-live-editor",JSON.stringify(state));alert("Saved");};
document.getElementById("reset").onclick=()=>{if(confirm("Reset project?")){state={...defaults};localStorage.removeItem("html-live-editor");render();}};
render();
</script>
</body></html>
